# devin-sdd-harness — port of claude-sdd-harness (origin: inspired by / forked
# from Bettatech). Adapted by Rubén Juárez Pérez. Ported to Devin CLI.
#
# Fill this first. It defines the operational envelope of the item.
id: INC-0000            # ticket id — the folder name under specs/
title: Short title
type: incident          # incident | feature | config | refactor
status: pending
lane: incident          # incident | handoff | light | full

environments:
  observed_in: PROD     # where the problem was seen
  reproduce_in: local   # where we reproduce it — prefer local, then PRE
  deploy_to: [PRE, PROD]  # where the fix must land, in order

affected_repos:
  - id: <repo-id>
    role: implementation
    order: 1
    why: <one line>
    paths: []
    verify:
      - <the real command, e.g. ./mvnw -q test>
      - <e.g. kubectl apply --dry-run=client -f k8s/>

personetics:
  involved: false       # does this cross the boundary?
  contract_ref: ""      # link to the clause in docs/personetics.md or Confluence

out_of_scope:
  - Unrelated refactors. An incident is the worst place for scope creep.

rollback:
  how: <the exact command or the previous image tag>
  blast_radius: <what a bad rollout takes down>

branch_hints: {}

notes: ""
